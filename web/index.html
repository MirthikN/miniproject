<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Water Distribution Management</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
html,body{height:100%}
body{margin:0;font-family:"IBM Plex Sans",system-ui,sans-serif;color:#14212b;background:#fff}
.page{display:grid;grid-template-columns:minmax(320px,46%) 1fr;min-height:100vh}
.brand{background:#0b2a3c;color:#fff;display:flex;flex-direction:column;justify-content:center;padding:4rem clamp(2rem,6vw,5rem);position:relative}
.brand:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 48px),repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 48px);pointer-events:none}
.brand h1{position:relative;z-index:1;font-weight:600;font-size:clamp(2rem,3.6vw,3rem);line-height:1.15;letter-spacing:-.01em;margin:0;max-width:440px}
.brand .rule{position:relative;z-index:1;width:56px;height:3px;background:#4aa3d4;margin-top:1.6rem}
.access{display:flex;flex-direction:column;justify-content:center;gap:1.25rem;padding:3rem clamp(1.5rem,6vw,5rem);background:#f4f6f8}
.portal{max-width:460px;width:100%;background:#fff;border:1px solid #d5dde3;border-left:4px solid #0f5c8a;border-radius:4px;padding:1.4rem 1.5rem;box-shadow:0 1px 2px rgba(11,42,60,.06);transition:box-shadow .15s,border-color .15s}
.portal:hover,.portal:focus-within{box-shadow:0 6px 18px rgba(11,42,60,.12)}
.portal.m{border-left-color:#6b7f8e}
.head{display:flex;align-items:center;gap:.9rem;margin-bottom:1.1rem}
.head svg{width:26px;height:26px;color:#0f5c8a;flex:none}.m .head svg{color:#4d6272}
.head h2{margin:0;font-size:1.1rem;font-weight:600}
.btn{display:block;width:100%;box-sizing:border-box;font:500 .95rem "IBM Plex Sans",sans-serif;text-align:center;text-decoration:none;color:#fff;background:#0f5c8a;border:0;border-radius:4px;padding:.7rem 1rem;cursor:pointer;transition:background .15s}
.btn:hover{background:#0b4a70}.m .btn{background:#3d5262}.m .btn:hover{background:#2c3e4b}
select{display:block;width:100%;box-sizing:border-box;font:inherit;font-size:.95rem;padding:.65rem .8rem;margin-bottom:.7rem;border:1px solid #b9c5cd;border-radius:4px;background:#fff;color:#14212b}
:focus-visible{outline:2px solid #0f5c8a;outline-offset:2px}
@media(max-width:820px){.page{grid-template-columns:1fr}.brand{padding:2.5rem 1.5rem}.access{padding:2rem 1.5rem 3rem}}
@media(prefers-reduced-motion:reduce){.portal,.btn{transition:none}}
</style></head><body>
<div class="page">
  <header class="brand">
    <h1>Smart Water Distribution Management</h1>
    <div class="rule"></div>
  </header>
  <main class="access">
    <section class="portal" aria-labelledby="d">
      <div class="head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v4l-2 11H5L3 9z"/><path d="M7 13c2-2 3 2 5 0s3 2 5 0"/></svg><h2 id="d">Dam User</h2></div>
      <a class="btn" href="dam.html">Sign in</a>
    </section>
    <section class="portal m" aria-labelledby="m">
      <div class="head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V7l8-4 8 4v14"/><path d="M9 21v-6h6v6M9 10h.01M15 10h.01"/></svg><h2 id="m">Municipal User</h2></div>
      <form id="mf"><select id="areas" aria-label="Select your area" required><option value="">Loading areas...</option></select><button class="btn">Sign in</button></form>
    </section>
  </main>
</div>
<div id="toast"></div>
<script src="js/api.js"></script>
<script>
(async () => {
  const a = await run(() => api('/areas'));
  $('#areas').innerHTML = a ? '<option value="">Select your area</option>' + a.map(x => `<option value="${esc(x.areaId)}">${esc(x.areaId)} - ${esc(x.areaName)}</option>`).join('')
    : '<option value="">No areas available</option>';
})();
$('#mf').onsubmit = e => { e.preventDefault(); const v = $('#areas').value; if (!v) return toast('Please select your area first.', true); sessionStorage.setItem('areaId', v); location.href = 'municipal.html'; };
</script></body></html>
