<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Municipal Dashboard - Smart Water Distribution</title>
  <meta name="description" content="Municipal portal for submitting water requirements, monitoring delivery schedules, and reporting infrastructure issues.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="municipal-app">
    <!-- Top Navigation Landmark -->
    <header class="top-nav" role="banner">
      <div class="brand-lockup">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-water)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 21V7l8-4 8 4v14"/>
          <path d="M9 21v-6h6v6M9 10h.01M15 10h.01"/>
        </svg>
        <span class="brand-title">Municipal Area Console</span>
        <span class="area-pill" id="who" aria-label="Current Area Identifier">Area Loading...</span>
      </div>
      <div class="nav-actions">
        <a class="out" href="index.html">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Switch User
        </a>
      </div>
    </header>

    <!-- Main Content Landmark -->
    <main id="main" tabindex="-1">
      <div class="page-header">
        <h1>Loading Municipal Telemetry...</h1>
        <p>Retrieving registered area parameters and consumption status</p>
      </div>
    </main>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/api.js"></script>
  <script>
    // The portal belongs to the area chosen on the first page
    const areaId = sessionStorage.getItem('areaId');
    if (!areaId) { location.replace('index.html'); throw new Error('no area selected'); }
    $('#who').textContent = 'Area ' + areaId;

    async function load() {
      // Immediate skeleton loading feedback
      $('#main').innerHTML = `
        <div class="page-header">
          <h1>Area ${esc(areaId)}</h1>
          <p class="muted">Loading municipal parameters and request history...</p>
        </div>
        ${skeletonCards(3)}
        ${skeletonTable(3)}
      `;

      const q = '?areaId=' + encodeURIComponent(areaId);
      const [me, req, src, hist, cfg, maint, pipes, rep] = await Promise.all([
        `/areas/${encodeURIComponent(areaId)}`, '/requests' + q, '/sources', '/history' + q,
        '/config', '/maintenance' + q, '/pipelines' + q, '/report' + q
      ].map(x => run(() => api(x))));

      const areaTitle = me ? esc(me.areaName) : `Area ${esc(areaId)}`;
      const config = cfg || {};
      const working = (pipes || []).filter(p => p.status === 'WORKING')
        .map(p => [p.pipelineId, `${p.pipelineId}: ${p.fromId} to ${p.toId}`]);

      const dateNote = config.currentDate
        ? `Current date: <strong>${esc(config.currentDate)}</strong> (Day ${esc(config.currentDay)})`
        : 'The current date has not been set yet.';

      $('#main').innerHTML = `
        <div class="page-header">
          <h1 class="big">${areaTitle}</h1>
          <p class="muted">Municipal Area Code: <strong>${esc(areaId)}</strong></p>
        </div>

        ${me ? `
          <div class="cards">
            <div class="stat"><span>Zoning Type</span><b>${esc(me.type)}</b></div>
            <div class="stat"><span>Registered Population</span><b>${Number(me.population || 0).toLocaleString()}</b></div>
            <div class="stat"><span>Base Daily Demand</span><b>${Number(me.dailyDemand || 0).toLocaleString()} L</b></div>
          </div>
        ` : ''}

        <!-- Operation Forms Row -->
        <div class="panel">
          <h2>Set Current Date</h2>
          <p class="muted">${dateNote}. Enter today's date and the system works out the day number for you.</p>
          ${config.startDate
            ? formHtml('day', [['date', 'Today\'s date', 'date']], 'Set Current Date')
              + '<p class="muted" id="dayPreview" aria-live="polite" style="margin-top:0.6rem"></p>'
            : '<p class="muted">The dam operator has not set the start date (Day 0) yet, so dates cannot be entered.</p>'}
        </div>

        <div class="panel">
          <h2>Submit Water Allocation Request</h2>
          <p class="muted">Specify required distribution volume for your municipal area. Flag as emergency only for critical shortage.</p>
          ${formHtml('rq', [['requiredWater', 'Water Needed (L)', 'number'], ['emergency', 'Urgent / Emergency Supply Request', 'checkbox']], 'Send Water Request')}
        </div>

        <div class="panel">
          <h2>Report Pipeline Incident</h2>
          <p class="muted">Notify dam engineers immediately of pipeline ruptures, abnormal pressure loss, or contamination. Only working pipelines connected to your area are listed.</p>
          ${working.length
            ? formHtml('fl', [['pipelineId', 'Pipeline', 'select', working], ['reason', 'Incident Description & Severity']], 'Submit Incident Report')
            : '<p class="muted">There are no working pipelines connected to your area to report.</p>'}
        </div>

        <!-- Data Tables -->
        <div class="panel">
          <h2>My Maintenance Requests</h2>
          <p class="muted">Repair tickets for pipelines connected to your area, most urgent first. The urgency score combines people left without water, whether an institution is cut off, and how long the ticket has been open.</p>
          ${table([
            ['Ticket', 'maintenanceId'],
            ['Pipeline', 'pipelineId'],
            ['Issue', 'issue'],
            ['Reported By', 'reportedBy'],
            ['Status', 'status'],
            ['Opened', 'openedOn'],
            ['Closed', 'closedOn'],
            ['People Affected', 'peopleAffected'],
            ['Urgency Score', 'score']
          ], maint, null, { wrap: true })}
        </div>

        <div class="panel">
          <h2>Area Request History</h2>
          ${table([
            ['Request ID', 'requestId'],
            ['Requested On', 'requestedOn'],
            ['Required (L)', 'requiredWater'],
            ['Emergency', 'emergency'],
            ['Priority', 'priority'],
            ['Allocated (L)', 'allocatedWater'],
            ['Unmet (L)', 'unmetWater'],
            ['Status', 'status']
          ], req)}
        </div>

        <div class="panel">
          <h2>Regional Water Sources</h2>
          ${table([
            ['Source Name', 'sourceName'],
            ['Remaining (L)', 'remainingWater'],
            ['Capacity (L)', 'totalCapacity']
          ], src)}
        </div>

        <div class="panel">
          <h2>Area Allocation Log</h2>
          ${hist && hist.length
            ? '<ul class="log">' + hist.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>'
            : '<p class="muted">No allocation events recorded for this area yet.</p>'}
        </div>

        <div class="panel">
          <h2>Day-wise Report</h2>
          <p class="muted">Water requests, allocations and maintenance requests for your area, day by day. Leave both dates empty to see everything.</p>
          <form class="f" id="rf">
            <label for="rf_from"><span>From date</span><input type="date" id="rf_from" name="from"></label>
            <label for="rf_to"><span>To date</span><input type="date" id="rf_to" name="to"></label>
            <button class="b" type="submit">Show Report</button>
          </form>
        </div>
        <div id="rout">${reportHtml(rep, false)}</div>
      `;

      // Helper to bind form submissions with loading/busy state
      const bind = (id, fn, okMsg) => {
        const formEl = $(id);
        if (!formEl) return;
        formEl.onsubmit = async e => {
          e.preventDefault();
          const submitBtn = e.target.querySelector('button[type="submit"]');
          const data = formData(e.target);
          const res = await run(() => fn(data), okMsg, submitBtn);
          if (res) load();
        };
      };

      // The date picker shows the day number it will become before it is sent
      const dateEl = $('#day_date');
      if (dateEl) {
        const preview = () => {
          const n = daysBetween(config.startDate, dateEl.value);
          $('#dayPreview').textContent = n === null ? '' : (n < 0
            ? 'That date is before the start date (' + config.startDate + ').'
            : dateEl.value + ' will be Day ' + n + '.');
        };
        dateEl.oninput = preview;
      }

      bind('#day', d => api('/day', 'POST', { date: d.date }), 'Current date updated');
      bind('#rq', d => api('/requests', 'POST', { ...d, areaId }), 'Water request submitted');
      bind('#fl', d => api(`/pipelines/${encodeURIComponent(d.pipelineId)}/fail`, 'POST', { reason: d.reason, areaId }), 'Incident reported to engineering');

      $('#rf').onsubmit = async e => {
        e.preventDefault();
        const f = e.target;
        const qs = new URLSearchParams({ areaId });
        if (f.from.value) qs.set('from', f.from.value);
        if (f.to.value) qs.set('to', f.to.value);
        const r = await run(() => api('/report?' + qs.toString()), null, f.querySelector('button'));
        if (r) $('#rout').innerHTML = reportHtml(r, false);
      };
    }

    load();
  </script>
</body>
</html>
